<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLSX / CSV 데이터 필터 및 저장기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx.full.min.js) for parsing & saving excel/csv -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Pretendard', sans-serif;
        }
        /* Custom scrollbar for data table */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-emerald-600 text-white rounded-xl shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight text-slate-900">엑셀/CSV 데이터 필터기</h1>
                    <p class="text-xs text-slate-500">데이터를 업로드하고 자유롭게 필터링하여 저장하세요</p>
                </div>
            </div>
            <button id="resetBtn" class="hidden text-sm px-3.5 py-2 text-slate-600 hover:text-red-600 border border-slate-300 hover:border-red-300 rounded-xl transition-all flex items-center gap-1.5 font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                초기화
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- 1. 파일 업로드 영역 -->
        <section id="uploadSection" class="bg-white rounded-2xl border-2 border-dashed border-slate-300 p-10 text-center hover:border-emerald-500 transition-all cursor-pointer shadow-sm">
            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="hidden">
            <div class="max-w-md mx-auto space-y-4">
                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <div>
                    <p class="text-lg font-bold text-slate-800">.XLSX, .XLS, .CSV 파일을 선택하세요</p>
                    <p class="text-xs text-slate-500 mt-1">파일을 여기에 드래그 앤 드롭하거나 클릭하여 업로드하세요.<br>모든 처리 과정은 브라우저에서 안전하게 수행됩니다.</p>
                </div>
                <button type="button" onclick="document.getElementById('fileInput').click()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-xl shadow-md hover:shadow-emerald-500/20 transition-all">
                    파일 불러오기
                </button>
            </div>
        </section>

        <!-- 로딩 표시기 -->
        <div id="loadingSpinner" class="hidden flex-col items-center justify-center py-16 space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-emerald-600 border-t-transparent"></div>
            <p id="loadingText" class="text-sm font-semibold text-slate-600">파일을 읽고 데이터를 해석 중입니다...</p>
        </div>

        <!-- 2. 데이터 처리 및 필터 영역 (업로드 후 표시) -->
        <div id="dataArea" class="hidden space-y-6">

            <!-- 파일 정보 & 전체 검색 및 필터 컨트롤 패널 -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                
                <!-- 상단: 파일명 및 요약 데이터 -->
                <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-100">
                    <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">현재 업로드된 파일</span>
                        <h2 id="fileNameDisplay" class="text-lg font-bold text-slate-800">data.xlsx</h2>
                    </div>
                    <div class="flex items-center gap-4 text-sm font-semibold">
                        <div class="bg-slate-100 px-3.5 py-1.5 rounded-lg text-slate-700">
                            전체 행: <span id="totalRowsDisplay" class="text-emerald-600">0</span>
                        </div>
                        <div class="bg-emerald-50 border border-emerald-200 px-3.5 py-1.5 rounded-lg text-emerald-800">
                            필터링된 행: <span id="filteredRowsDisplay" class="text-emerald-600">0</span>
                        </div>
                    </div>
                </div>

                <!-- 하단: 필터 추가/검색 도구 -->
                <div class="space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <h3 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                            </svg>
                            조건별 필터 규칙 설정
                        </h3>
                        <div class="flex items-center gap-2">
                            <button id="addFilterBtn" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-medium text-xs rounded-lg transition-colors flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                </svg>
                                필터 조건 추가
                            </button>
                            <button id="clearFiltersBtn" class="px-3 py-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium text-xs rounded-lg transition-colors">
                                모든 필터 초기화
                            </button>
                        </div>
                    </div>

                    <!-- 동적 필터 규칙 컨테이너 -->
                    <div id="filterRulesContainer" class="space-y-2">
                        <!-- JS에서 동적으로 필터 행 추가 -->
                    </div>

                    <!-- 전체 검색 바 (Global Search) -->
                    <div class="pt-2 flex items-center gap-2">
                        <div class="relative flex-1">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </span>
                            <input type="text" id="globalSearchInput" placeholder="전체 열에서 빠른 검색어 입력..." class="w-full text-sm pl-9 pr-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                        </div>
                    </div>
                </div>

            </div>

            <!-- 데이터 테이블 미리보기 -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500 uppercase">데이터 미리보기 (최대 100행 표시)</span>
                    <span id="previewNotice" class="text-xs text-slate-400"></span>
                </div>
                <div class="overflow-x-auto max-h-[500px] custom-scrollbar">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead id="tableHeader" class="bg-slate-100 text-slate-700 sticky top-0 border-b border-slate-200 z-10">
                            <!-- JS로 컬럼 헤더가 자동 생성됩니다 -->
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100 text-slate-600">
                            <!-- JS로 데이터 행이 자동 생성됩니다 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 하단 다운로드 패널 -->
            <div class="sticky bottom-4 bg-white/95 backdrop-blur-md p-4 rounded-2xl border border-slate-200 shadow-xl flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div>
                        <p class="text-xs text-slate-500">저장 파일명</p>
                        <input type="text" id="outputFileName" value="filtered_data" class="text-sm font-bold bg-transparent border-b border-slate-300 focus:outline-none focus:border-emerald-600 px-1 py-0.5 w-48">
                    </div>
                    <div class="text-xs text-slate-400 flex items-center">
                        .xlsx / .csv 선택 저장
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button id="downloadCsvBtn" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl text-sm shadow-md transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        CSV로 저장
                    </button>
                    <button id="downloadXlsxBtn" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow-lg hover:shadow-emerald-500/20 transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        EXCEL(XLSX) 저장
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- 알림 메시지 토스트 -->
    <div id="toast" class="fixed top-5 right-5 transform translate-y-[-100px] opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-3 text-sm">
        <span id="toastMessage">메시지 내용</span>
    </div>

    <script>
        // DOM 엘리먼트 참조
        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const dataArea = document.getElementById('dataArea');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const totalRowsDisplay = document.getElementById('totalRowsDisplay');
        const filteredRowsDisplay = document.getElementById('filteredRowsDisplay');
        const filterRulesContainer = document.getElementById('filterRulesContainer');
        const addFilterBtn = document.getElementById('addFilterBtn');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');
        const globalSearchInput = document.getElementById('globalSearchInput');
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const previewNotice = document.getElementById('previewNotice');
        const outputFileName = document.getElementById('outputFileName');
        const downloadCsvBtn = document.getElementById('downloadCsvBtn');
        const downloadXlsxBtn = document.getElementById('downloadXlsxBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 전역 상태 변수
        let rawData = [];         // 원본 전체 JSON 데이터 (배열 형태)
        let headers = [];         // 컬럼 목록
        let filteredData = [];    // 현재 조건으로 필터링된 데이터
        let filterRules = [];     // 사용자 설정 필터 규칙 목록 [{ column, operator, value }]

        // 토스트 알림창 출력
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 3000);
        }

        // 드래그 앤 드롭 이벤트
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('border-emerald-500', 'bg-emerald-50/50');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('border-emerald-500', 'bg-emerald-50/50');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('border-emerald-500', 'bg-emerald-50/50');
            if (e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        // 파일 처리 핵심 로직 (SheetJS)
        function processFile(file) {
            const fileName = file.name;
            const ext = fileName.split('.').pop().toLowerCase();

            if (!['xlsx', 'xls', 'csv'].includes(ext)) {
                showToast('.xlsx, .xls, .csv 형식의 파일만 지원됩니다.');
                return;
            }

            fileNameDisplay.innerText = fileName;
            const baseName = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
            outputFileName.value = `${baseName}_filtered`;

            uploadSection.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');
            loadingSpinner.classList.add('flex');

            const reader = new FileReader();

            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    // 첫 번째 시트 가져오기
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // JSON 형태로 변환
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (jsonData.length === 0) {
                        showToast('파일에 데이터가 존재하지 않거나 올바르지 않습니다.');
                        resetApp();
                        return;
                    }

                    rawData = jsonData;
                    headers = Object.keys(jsonData[0]);
                    
                    // 초기 필터 데이터 세팅
                    filteredData = [...rawData];

                    totalRowsDisplay.innerText = rawData.length.toLocaleString();

                    // 필터 규칙 초기화 및 첫 번째 규칙 추가
                    filterRulesContainer.innerHTML = '';
                    filterRules = [];
                    addFilterRuleRow();

                    // 화면 업데이트
                    applyFilters();

                    loadingSpinner.classList.add('hidden');
                    loadingSpinner.classList.remove('flex');
                    dataArea.classList.remove('hidden');
                    resetBtn.classList.remove('hidden');

                } catch (err) {
                    console.error(err);
                    showToast('파일을 해석하는 도중 오류가 발생했습니다.');
                    resetApp();
                }
            };

            reader.readAsArrayBuffer(file);
        }

        // 필터 조건 행(UI) 추가
        function addFilterRuleRow() {
            const ruleId = Date.now() + Math.random().toString(36).substr(2, 4);
            const rowDiv = document.createElement('div');
            rowDiv.className = "flex flex-wrap items-center gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-sm";
            rowDiv.setAttribute('data-rule-id', ruleId);

            // 열 선택 셀렉터
            const colSelect = document.createElement('select');
            colSelect.className = "filter-col text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium";
            headers.forEach(h => {
                const opt = document.createElement('option');
                opt.value = h;
                opt.innerText = h;
                colSelect.appendChild(opt);
            });

            // 연산자 셀렉터
            const opSelect = document.createElement('select');
            opSelect.className = "filter-op text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500";
            const operators = [
                { val: 'contains', text: '포함함 (Contains)' },
                { val: 'equals', text: '일치함 (Equals)' },
                { val: 'starts', text: '시작함 (Starts with)' },
                { val: 'ends', text: '끝남 (Ends with)' },
                { val: 'gt', text: '초과 (>)' },
                { val: 'gte', text: '이상 (>=)' },
                { val: 'lt', text: '미만 (<)' },
                { val: 'lte', text: '이하 (<=)' },
                { val: 'not_equals', text: '일치하지 않음 (!=)' }
            ];
            operators.forEach(op => {
                const opt = document.createElement('option');
                opt.value = op.val;
                opt.innerText = op.text;
                opSelect.appendChild(opt);
            });

            // 값 입력창
            const valInput = document.createElement('input');
            valInput.type = "text";
            valInput.placeholder = "필터값 입력...";
            valInput.className = "filter-val flex-1 min-w-[120px] text-xs bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500";

            // 삭제 버튼
            const delBtn = document.createElement('button');
            delBtn.className = "text-slate-400 hover:text-red-500 p-1 transition-colors";
            delBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            `;
            delBtn.onclick = () => {
                rowDiv.remove();
                applyFilters();
            };

            // 이벤트 바인딩
            colSelect.onchange = applyFilters;
            opSelect.onchange = applyFilters;
            valInput.oninput = applyFilters;

            rowDiv.appendChild(colSelect);
            rowDiv.appendChild(opSelect);
            rowDiv.appendChild(valInput);
            rowDiv.appendChild(delBtn);

            filterRulesContainer.appendChild(rowDiv);
        }

        addFilterBtn.addEventListener('click', () => {
            addFilterRuleRow();
            applyFilters();
        });

        clearFiltersBtn.addEventListener('click', () => {
            filterRulesContainer.innerHTML = '';
            globalSearchInput.value = '';
            addFilterRuleRow();
            applyFilters();
        });

        globalSearchInput.addEventListener('input', applyFilters);

        // 필터 조건 적용 로직
        function applyFilters() {
            // 현재 설정된 필터 조건들 추출
            const ruleElements = filterRulesContainer.querySelectorAll('[data-rule-id]');
            const activeRules = [];

            ruleElements.forEach(el => {
                const col = el.querySelector('.filter-col').value;
                const op = el.querySelector('.filter-op').value;
                const val = el.querySelector('.filter-val').value.trim();

                if (val !== '') {
                    activeRules.push({ col, op, val });
                }
            });

            const globalSearch = globalSearchInput.value.trim().toLowerCase();

            // 데이터 필터링 실행
            filteredData = rawData.filter(row => {
                // 1. 개별 규칙 필터링 (AND 조건)
                for (const rule of activeRules) {
                    const cellVal = String(row[rule.col] ?? '');
                    const cellValLower = cellVal.toLowerCase();
                    const targetValLower = rule.val.toLowerCase();

                    const numCell = parseFloat(cellVal);
                    const numTarget = parseFloat(rule.val);
                    const isNumeric = !isNaN(numCell) && !isNaN(numTarget);

                    switch (rule.op) {
                        case 'contains':
                            if (!cellValLower.includes(targetValLower)) return false;
                            break;
                        case 'equals':
                            if (cellValLower !== targetValLower) return false;
                            break;
                        case 'not_equals':
                            if (cellValLower === targetValLower) return false;
                            break;
                        case 'starts':
                            if (!cellValLower.startsWith(targetValLower)) return false;
                            break;
                        case 'ends':
                            if (!cellValLower.endsWith(targetValLower)) return false;
                            break;
                        case 'gt':
                            if (!isNumeric || numCell <= numTarget) return false;
                            break;
                        case 'gte':
                            if (!isNumeric || numCell < numTarget) return false;
                            break;
                        case 'lt':
                            if (!isNumeric || numCell >= numTarget) return false;
                            break;
                        case 'lte':
                            if (!isNumeric || numCell > numTarget) return false;
                            break;
                    }
                }

                // 2. 전체 검색어 필터링
                if (globalSearch !== '') {
                    const matchGlobal = headers.some(h => {
                        return String(row[h] ?? '').toLowerCase().includes(globalSearch);
                    });
                    if (!matchGlobal) return false;
                }

                return true;
            });

            // 카운트 UI 업데이트
            filteredRowsDisplay.innerText = filteredData.length.toLocaleString();

            // 테이블 렌더링
            renderTable();
        }

        // 테이블 DOM 렌더링
        function renderTable() {
            // 헤더 작성
            tableHeader.innerHTML = '';
            const trHead = document.createElement('tr');
            headers.forEach(h => {
                const th = document.createElement('th');
                th.className = "px-4 py-3 font-semibold whitespace-nowrap border-b border-slate-200";
                th.innerText = h;
                trHead.appendChild(th);
            });
            tableHeader.appendChild(trHead);

            // 바디 작성 (성능을 위해 상위 100행만 표기)
            tableBody.innerHTML = '';
            const displayLimit = Math.min(filteredData.length, 100);

            if (filteredData.length > 100) {
                previewNotice.innerText = `(전체 ${filteredData.length}개 결과 중 100개 항목 표시 중)`;
            } else {
                previewNotice.innerText = `(전체 ${filteredData.length}개 결과 표시 중)`;
            }

            if (filteredData.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = headers.length || 1;
                td.className = "px-4 py-8 text-center text-slate-400 font-medium";
                td.innerText = "조건에 일치하는 데이터가 없습니다.";
                tr.appendChild(td);
                tableBody.appendChild(tr);
                return;
            }

            for (let i = 0; i < displayLimit; i++) {
                const row = filteredData[i];
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";

                headers.forEach(h => {
                    const td = document.createElement('td');
                    td.className = "px-4 py-2.5 whitespace-nowrap border-b border-slate-100 max-w-xs truncate";
                    td.innerText = row[h] !== undefined ? row[h] : '';
                    td.title = row[h]; // Tooltip
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            }
        }

        // CSV 저장 기능
        downloadCsvBtn.addEventListener('click', () => {
            if (filteredData.length === 0) {
                showToast('저장할 데이터가 없습니다.');
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(filteredData);
            const csvOutput = XLSX.utils.sheet_to_csv(worksheet);

            // UTF-8 BOM 추가하여 한글 깨짐 방지
            const blob = new Blob(["\uFEFF" + csvOutput], { type: 'text/csv;charset=utf-8;' });
            saveBlob(blob, getFileName('.csv'));
        });

        // XLSX 저장 기능
        downloadXlsxBtn.addEventListener('click', () => {
            if (filteredData.length === 0) {
                showToast('저장할 데이터가 없습니다.');
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(filteredData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Filtered_Data");

            const excelBuffer = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([excelBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            saveBlob(blob, getFileName('.xlsx'));
        });

        // 파일명 생성 도우미
        function getFileName(extension) {
            let name = outputFileName.value.trim();
            if (!name) name = 'filtered_data';
            if (!name.toLowerCase().endsWith(extension)) {
                name += extension;
            }
            return name;
        }

        // 파일 다운로드 브라우저 처리
        function saveBlob(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);

            showToast(`${filename} 파일이 저장되었습니다.`);
        }

        // 앱 초기화
        function resetApp() {
            rawData = [];
            headers = [];
            filteredData = [];
            filterRules = [];

            fileInput.value = '';
            globalSearchInput.value = '';
            filterRulesContainer.innerHTML = '';
            tableHeader.innerHTML = '';
            tableBody.innerHTML = '';

            dataArea.classList.add('hidden');
            resetBtn.classList.add('hidden');
            uploadSection.classList.remove('hidden');
        }

        resetBtn.addEventListener('click', resetApp);
    </script>
</body>
</html>
